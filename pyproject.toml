[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscrape"
version = "1.0.0"
description = "Collect US software job postings from ATS boards and public job APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Excel export. openpyxl only — pandas/numpy are deliberately not required.
excel = ["openpyxl>=3.1"]
# `jobright-fetch` — logs into JobRight.ai with a real Chrome via Selenium.
# Manual/local only; never installed in the Docker image.
jobright = ["selenium>=4.27", "undetected-chromedriver>=3.5.5", "setuptools>=75"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.scripts]
jobscrape = "jobscrape.cli:main"

[tool.setuptools.packages.find]
include = ["jobscrape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
